<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | POS System</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/login.css">
    <script src="auth.js"></script>
</head>
<body>
    <div class="login-page">

        <section class="login-brand">
            <h1>POS<span> System</span></h1>
            <div>
                <h2>Run your shop from one screen.</h2>
                <p>Sales, products, orders and customers in one place.</p>
            </div>
            <p>&copy; 2026 POS System</p>
        </section>

        <section class="login-form-wrap">
            <div class="login-card">
                <h2>Admin sign in</h2>
                <p class="sub">Enter your details to open the dashboard.</p>

                <div class="login-error" id="error" role="alert"></div>

                <form id="loginForm" autocomplete="on">
                    <div class="field">
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <div class="password-box">
                            <input id="password" name="password" type="password" autocomplete="current-password" required>
                            <button type="button" class="toggle-pass" id="toggle" aria-label="Show password">Show</button>
                        </div>
                    </div>

                    <button class="btn" type="submit" id="submitBtn">Sign in</button>
                </form>
            </div>
        </section>

    </div>
</body>
</html>
