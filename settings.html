<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | POS System</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <h2>POS<span> System</span></h2>
            <nav><a href="index.html">Dashboard</a><a href="products.html">Products</a><a
                    href="categories.html">Categories</a><a href="orders.html">Orders</a><a
                    href="customers.html">Customers</a><a href="reports.html">Reports</a><a class="active"
                    aria-current="page" href="settings.html">Settings</a></nav>
            <div class="logout"><a href="#">Logout</a></div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div>
                    <h2>Point of Sale</h2>
                    <p>Manage your sales and orders</p>
                </div>
                <div class="profile"><span>Admin</span>
                    <div class="avatar">A</div>
                </div>
            </header>
            <div class="content">
                <div class="page-title">
                    <h2>Settings</h2>
                    <p>Configure your POS system.</p>
                </div>
                <div class="panel" style="max-width:700px">
                    <div class="field"><label>Store Name</label><input value="My POS Store"></div>
                    <div class="field"><label>Store Phone</label><input placeholder="Enter phone number"></div>
                    <div class="field"><label>Store Address</label><textarea rows="3"
                            placeholder="Enter store address"></textarea></div>
                    <div class="field"><label>Currency</label><select>
                            <option>LKR - Sri Lankan Rupee</option>
                            <option>USD - US Dollar</option>
                        </select></div><button class="btn">Save Settings</button>
                </div>
            </div>
        </main>
    </div>
    <script src="JS/script.js"></script>
</body>

</html>
