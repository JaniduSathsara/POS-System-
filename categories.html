<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | POS System</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <h2>POS<span> System</span></h2>
            <nav><a href="index.html">Dashboard</a><a href="products.html">Products</a><a class="active"
                    aria-current="page" href="categories.html">Categories</a><a href="orders.html">Orders</a><a
                    href="customers.html">Customers</a><a href="reports.html">Reports</a><a
                    href="settings.html">Settings</a></nav>
            <div class="logout"><a href="#">Logout</a></div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div>
                    <h2>Point of Sale</h2>
                    <p>Manage your sales and orders</p>
                </div>
                <div class="profile"><span>Admin</span>
                    <div class="avatar">A</div>
                </div>
            </header>
            <div class="content">
                <div class="page-title">
                    <h2>Categories</h2>
                    <p>Organize products into categories.</p>
                </div>
                <div class="panel">
                    <div class="toolbar">
                        <div class="search"><input placeholder="Search categories..."></div><button class="btn">+ Add
                            Category</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Description</th>
                                <th>Products</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Food</td>
                                <td>Food items</td>
                                <td>18</td>
                                <td><span class="status">Active</span></td>
                            </tr>
                            <tr>
                                <td>Drinks</td>
                                <td>Beverages</td>
                                <td>12</td>
                                <td><span class="status">Active</span></td>
                            </tr>
                            <tr>
                                <td>Snacks</td>
                                <td>Snack items</td>
                                <td>9</td>
                                <td><span class="status">Active</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="JS/script.js"></script>
</body>

</html>
